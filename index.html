<style>
:root{
  --bg:#eff1f5;
  --card:#ffffffaa;
  --text:#53576c;
  --muted:#999;
  --border:#eeeeee;
  --accent:#94dbea;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Segoe UI, system-ui, sans-serif;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:12px;
  user-select: none;
}

h1{
  font-family:Cursive;
  font-size:64px;
  font-weight:300;
}

h2{
  font-family:Cursive;
  font-size:24px;
  font-weight:300;
  margin-top:20px;
  margin-bottom:20px;
}

subtitle{
  font-size:18px;
  margin-bottom:40px;
}

.dials{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  gap: 12px 12px;
}

.dial{
  width:120px;
  aspect-ratio:1/1;
  padding:20px 8px 8px 8px;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;

  color:var(--text);
  text-decoration:none;

  transition:0.15s ease;
}

.dial:hover{
  transform:scale(1.05);
  border-color:var(--accent);
}

.dial:active{
  transform:scale(1.00);
  background:var(--accent);
  border-color:var(--accent);
}

.icon{
  font-size:40px;
  margin-bottom:4px;
}

.label{
  font-size:14px;
  text-align:center;
}

footer{
  margin-top:80px;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>
